<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Energy Warriors</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>⚡ Energy Warriors ⚡</h1>


<div class="arena">


<img id="enemyImage" 
src="assets/enemy.png"
alt="enemy">


<div id="damage">
</div>


<img id="playerImage"
src="assets/player.png"
alt="player">


</div>




<div class="status">


<div class="fighterStatus">

<h2>プレイヤー</h2>

<div class="hp">

<div id="playerHP"></div>

</div>


<p>
気力：
<span id="playerKi">
100
</span>
</p>

</div>




<div class="fighterStatus">

<h2>敵</h2>

<div class="hp">

<div id="enemyHP"></div>

</div>


</div>



</div>





<div class="cards">


<button onclick="attack(10)">
👊<br>
打撃
</button>


<button onclick="attack(15)">
🔥<br>
気弾
</button>


<button onclick="attack(20)">
⚡<br>
強攻撃
</button>


<button onclick="special()">
🌟<br>
必殺技
</button>


</div>



<h2 id="message"></h2>



<script src="game.js"></script>


</body>

</html>
